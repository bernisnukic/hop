{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hop.fullname" . }}-dashboard
  labels:
    {{- include "hop.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  hop.json: |-
    {{- .Files.Get "dashboards/hop.json" | nindent 4 }}
{{- end }}
