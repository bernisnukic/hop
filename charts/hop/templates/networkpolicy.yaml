{{- if .Values.networkPolicy.enabled }}
# hop takes HTTP from anywhere, metrics only from the monitoring namespace,
# and may only talk to DNS and its own database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hop.fullname" . }}
  labels:
    {{- include "hop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hop.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace }}
      ports:
        - port: metrics
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if .Values.postgres.cnpg.enabled }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "hop.dbCluster" . }}
      ports:
        - port: 5432
    {{- else }}
    - ports:
        - port: 5432
    {{- end }}
{{- end }}
