# `helm test` creates a link through the Service and follows it.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hop.fullname" . }}-smoke
  # Not hop's selector labels: with them, the Service would send traffic to
  # this pod and the NetworkPolicy would cut its egress to hop.
  labels:
    app.kubernetes.io/name: {{ include "hop.name" . }}-smoke
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: curlimages/curl:8.17.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      command: [sh, -ec]
      args:
        - |
          base=http://{{ include "hop.fullname" . }}:{{ .Values.service.port }}
          opts="--connect-timeout 5 --max-time 10"
          code=$(curl $opts -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/smoke"}' "$base/api/links" | sed -E 's/.*"code":"([^"]+)".*/\1/')
          echo "created $code"
          loc=$(curl $opts -fsS -o /dev/null -w '%{redirect_url}' "$base/$code")
          test "$loc" = "https://example.com/smoke"
          echo "redirect ok"
