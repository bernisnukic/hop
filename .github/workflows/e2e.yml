name: e2e

# Stands the whole stack up on kind with Terraform and runs scripts/e2e.sh:
# the helm test, Prometheus scraping and SLO rules, a rolling restart under
# load, and the network policy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        network_policy: ["true", "false"]
    env:
      NETWORK_POLICY: ${{ matrix.network_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: kernel modules for NetworkPolicy
        # kindnet enforces NetworkPolicy through an NFQUEUE; the runner image
        # does not load the queue module by default.
        run: |
          sudo modprobe nfnetlink_queue || true
          lsmod | grep -E 'nfnetlink_queue|nf_tables' || echo "nfnetlink_queue not loaded"
      - name: install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind && rm kind
          kind version
      - run: scripts/e2e.sh
      - name: diagnostics
        if: failure()
        run: |
          export KUBECONFIG=$(terraform -chdir=terraform/envs/kind output -raw kubeconfig_path 2>/dev/null) || { echo "no cluster was created"; exit 0; }
          kubectl get pods -A -o wide
          kubectl -n hop describe pods
          kubectl -n hop logs -l app.kubernetes.io/name=hop --tail=100 --prefix
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          lsmod | grep -E 'nfnetlink|nf_tables|nf_conntrack' || true
          for p in $(kubectl -n kube-system get pods -l app=kindnet -o name); do
            echo "== $p"; kubectl -n kube-system logs "$p" | grep -viE '^I.*(Handling node|handling current node)' | tail -30
          done
          probe() { kubectl -n hop run "probe-$1" --rm -i --restart=Never --image=curlimages/curl:8.17.0 -- \
            sh -c 'for i in 1 2 3; do curl -s -m 3 -o /dev/null -w "%{http_code}\n" http://hop/healthz; done' || true; }
          echo "== with NetworkPolicy"; probe np
          kubectl -n hop delete networkpolicy hop || true
          echo "== without NetworkPolicy"; probe nonp
